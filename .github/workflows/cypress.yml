name: Testes E2E - Cypress - Pgats-automacao-web-2026

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências e executar os testes
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: cypress/reports/html
          if-no-files-found: warn

      - name: Publicar screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-cypress
          path: cypress/screenshots
          if-no-files-found: ignore
